
<!doctype html>

<style>

<script>
'use strict';

/*
 第8回 ARK3ビンゴ
 更新版：青α

 追加：
 スタッフパネル制覇！
 50/50チャレンジ

 実際の確率：
 スタッフ 50%
 ステーション 20%
 愛❤️ 30%
*/

const KEY='ark3_bingo_eighth_v1';
const N=10;
const SIZE=100;

const AREAS=[
 '笹塚',
 '南台',
 '千駄ヶ谷',
 '松濤',
 '幡ヶ谷',
 '松原',

 '元代々木',

 '羽根木',
 '大原',
 '代々木',
 '北沢',
 '代田',
 '初台',
 '永福',
 '和泉',
 '上原',
 '大山',
 '大宮',
 '神山町'
];

const NORMAL=[
 'タワマン',
 'ガーデン',
 'パレス',
 '投資パネル',
 'アップル1',
 'アップル2',
 'アップル3',
 'アップル4',
 'バナナ1',
 'バナナ2',
 'バナナ3',
 'バナナ4',
 'キャロット1',
 'キャロット2',
 'キャロット3',
 'キャロット4',
 '荷物１つ',
 '荷物２つ',
 '荷物３つ',
 '荷物４つ',
 '階段２F',
 '階段３F',
 '階段４F',
 '階段５F',
 '階段∞',
 '長距離3.8',
 '近距離0.5',
 '戸建',
 '店舗',
 '持ち帰り',
 '配達なし',
 '雨配達',
 'オートロック２個以上',
 '防災センター'
];

const STAFF_BASE=[
 '矢田部さん',
 '野田さん',
 '金子さん',
 '福島さん',
 '大島さん',
 '川田さん',
 '萩原さん',
 '松井さん'
];

const STAFF=[
 ...STAFF_BASE,
 '長谷川さん'
];

const STATIONS=[
 '五反田',
 '塩浜',
 '麻布十番',
 '自由が丘',
 '大森',
 '千歳船橋',
 '南青山',
 '三軒茶屋',
 '新橋',
 '北千束'
];

const PANEL_READINGS={
 '笹塚':'ささづか',
 '南台':'みなみだい',
 '千駄ヶ谷':'せんだがや',
 '松濤':'しょうとう',
 '幡ヶ谷':'はたがや',
 '松原':'まつばら',
 '西新宿':'にししんじゅく',
 '西原':'にしはら',
 '富ヶ谷':'とみがや',
 '和田':'わだ',
 '堀之内':'ほりのうち',
 '方南町':'ほうなんちょう',
 '渋谷本町':'しぶやほんちょう',
 '中野本町':'なかのほんちょう',
 '元代々木':'もとよよぎ',
 '弥生町':'やよいちょう',
 '羽根木':'はねぎ',
 '大原':'おおはら',
 '代々木':'よよぎ',
 '北沢':'きたざわ',
 '代田':'だいた',
 '初台':'はつだい',
 '永福':'えいふく',
 '和泉':'いずみ',
 '上原':'うえはら',
 '大山':'おおやま',
 '大宮':'おおみや',
 '神山町':'かみやまちょう',
 '五反田':'ごたんだ',
 '塩浜':'しおはま',
 '麻布十番':'あざぶじゅうばん',
 '自由が丘':'じゆうがおか',
 '大森':'おおもり',
 '千歳船橋':'ちとせふなばし',
 '南青山':'みなみあおやま',
 '三軒茶屋':'さんげんぢゃや',
 '新橋':'しんばし',
 '北千束':'きたせんぞく',
 '矢田部さん':'やたべさん',
 '野田さん':'のださん',
 '金子さん':'かねこさん',
 '福島さん':'ふくしまさん',
 '大島さん':'おおしまさん',
 '川田さん':'かわださん',
 '萩原さん':'はぎわらさん',
 '長谷川さん':'はせがわさん',
 '松井さん':'まついさん',
 '投資パネル':'とうしぱねる',
 '防災センター':'ぼうさいせんたー',
 '荷物１つ':'にもつ1つ',
 '荷物２つ':'にもつ2つ',
 '荷物３つ':'にもつ3つ',
 '荷物４つ':'にもつ4つ',
 '階段２F':'かいだん2f',
 '階段３F':'かいだん3f',
 '階段４F':'かいだん4f',
 '階段５F':'かいだん5f',
 '階段∞':'かいだんむげん',
 '長距離3.8':'ちょうきょり3.8',
 '近距離0.5':'きんきょり0.5',
 '戸建':'こだて',
 '店舗':'てんぽ',
 '持ち帰り':'もちかえり',
 '配達なし':'はいたつなし',
 '雨配達':'あめはいたつ',
 'オートロック２個以上':'おーとろっく2こいじょう',
 'FREE':'ふりー',
 '愛❤️':'あい'
};

const kanaReading=s=>
 (PANEL_READINGS[s]||s).replace(
  /[ァ-ヶ]/g,
  c=>String.fromCharCode(c.charCodeAt(0)-96)
 );

const kanaCollator=new Intl.Collator('ja',{
 numeric:true,
 sensitivity:'base'
});

const comparePanels=(a,b)=>
 kanaCollator.compare(kanaReading(a),kanaReading(b))||
 kanaCollator.compare(a,b);

const isStation=name=>STATIONS.includes(name);
const isStaff=name=>STAFF.includes(name);

const random=a=>
 a[Math.floor(Math.random()*a.length)];

const shuffle=a=>{
 const b=[...a];

 for(let i=b.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }

 return b;
};

const staffVariant=name=>
 name==='萩原さん'&&Math.random()<0.5
 ?'長谷川さん'
 :name;

const randomStaff=()=>staffVariant(random(STAFF_BASE));

const $=id=>document.getElementById(id);

const LINES=[];

for(let r=0;r<N;r++){
 LINES.push(
  Array.from({length:N},(_,c)=>r*N+c)
 );
}

for(let c=0;c<N;c++){
 LINES.push(
  Array.from({length:N},(_,r)=>r*N+c)
 );
}

LINES.push(
 Array.from({length:N},(_,i)=>i*N+i)
);

LINES.push(
 Array.from({length:N},(_,i)=>i*N+N-1-i)
);

let state;

let modalBusy=false;
let pickMode=false;
let negiSearchActive=false;

let previousBingoCount=null;
let previousReachCount=null;

let blueTapIndex=-1;
let blueTapCount=0;

const reachAudio=new Audio('syuuka.mp3');
const bingoAudio=new Audio('sokuji.mp3');
const sevenAudio=new Audio('seven.mp3');
const tenAudio=new Audio('ten.mp3');

function playGameSound(audio){
 if(!state?.sound)return;

 try{
  audio.pause();
  audio.currentTime=0;

  const promise=audio.play();

  if(promise?.catch){
   promise.catch(()=>{});
  }
 }catch(e){}
}

/* 新規カード */

function fresh(){
 const free=Math.floor(Math.random()*SIZE);

 const areaCount=
  37+Math.floor(Math.random()*8);

 const stationCount=
  4+Math.floor(Math.random()*5);

 const slots=shuffle(
  Array.from({length:SIZE},(_,i)=>i)
   .filter(i=>i!==free)
 );

 const cells=Array.from(
  {length:SIZE},
  ()=>({
   name:'',
   checked:false,
   kind:'normal',
   hit:false
  })
 );

 let pos=0;

 for(let j=0;j<areaCount;j++){
  cells[slots[pos++]].name=random(AREAS);
 }

 for(let j=0;j<stationCount;j++){
  cells[slots[pos++]].name=random(STATIONS);
 }

 cells[slots[pos++]].name=randomStaff();

 const pool=[
  ...NORMAL,
  ...STAFF_BASE
 ];

 while(pos<slots.length){
  cells[slots[pos++]].name=
   staffVariant(random(pool));
 }

 cells[free]={
  name:'FREE',
  checked:true,
  kind:'free',
  hit:false
 };

 return {
  cells,
  free,
  initialStationCount:stationCount,
  initialAreaCount:areaCount,
  last:null,
  locked:false,
  sound:true,
  negiHistory:[],
  hits:0,
  hitEvents:{},
  event25:false,
  eventStation:false,
  event7:false,

  // 新イベントの発生済み記録
  eventStaffComplete:false,

  threshold:25+Math.floor(Math.random()*11),
  pending:null,
  manualCount:0,
  stationEventUndo:null
 };
}

function save(){
 localStorage.setItem(
  KEY,
  JSON.stringify(state)
 );
}

function load(){
 try{
  const s=JSON.parse(
   localStorage.getItem(KEY)
  );

  if(s&&s.cells?.length===SIZE){

   if(!s.hasegawaMigrationV1){
    for(const c of s.cells){
     if(c.name==='萩原さん'){
      c.name=staffVariant(c.name);
     }
    }

    s.hasegawaMigrationV1=true;
   }

   if(!s.hitEvents){
    s.hitEvents={};
   }

   if(!s.negiHistory){
    s.negiHistory=[];
   }

   if(!('stationEventUndo' in s)){
    s.stationEventUndo=null;
   }

   // 旧カードにも新イベントを追加
   if(!('eventStaffComplete' in s)){
    s.eventStaffComplete=false;
   }

   localStorage.setItem(
    KEY,
    JSON.stringify(s)
   );

   return s;
  }
 }catch(e){}

 return fresh();
}

function repairMissingStations(){
 if(state.cells.some(c=>isStation(c.name))){
  return false;
 }

 if(
  state.event25||
  state.eventStation||
  state.event7||
  state.pending
 ){
  return false;
 }

 const candidates=shuffle(
  state.cells
   .map((c,i)=>({c,i}))
   .filter(({c,i})=>
    i!==state.free&&
    !c.checked&&
    c.kind==='normal'
   )
   .map(({i})=>i)
 );

 const names=shuffle(STATIONS).slice(
  0,
  Math.min(
   candidates.length,
   4+Math.floor(Math.random()*5)
  )
 );

 names.forEach((name,j)=>{
  state.cells[candidates[j]].name=name;
 });

 state.initialStationCount=names.length;

 return names.length>0;
}

/* 集計 */

function checkedCount(){
 return state.cells.filter(c=>
  c.checked&&c.kind!=='free'
 ).length;
}

function manualCount(){
 return state.cells.filter(c=>
  c.checked&&
  !['free','orange','darkblue'].includes(c.kind)
 ).length;
}

function linesStatus(){
 const bingo=[];
 const reach=[];

 for(const line of LINES){
  const open=line.filter(i=>
   state.cells[i].checked
  ).length;

  if(open===N){
   bingo.push(line);
  }else if(open===N-1){
   reach.push(line);
  }
 }

 return {bingo,reach};
}

/*
 スタッフ制覇条件

 1. カードにスタッフが1枚以上存在
 2. すべてのスタッフマスが開封済み
 3. FREEを除き60マス以上開封
 4. リーチが1本以上
*/

function staffCompleteConditions(){
 const staffCells=state.cells.filter(c=>
  isStaff(c.name)
 );

 if(staffCells.length===0){
  return false;
 }

 if(!staffCells.every(c=>c.checked)){
  return false;
 }

 if(checkedCount()<60){
  return false;
 }

 const {reach}=linesStatus();

 if(reach.length===0){
  return false;
 }

 return true;
}

/*
 リーチを完成させる未開封マスの
 候補を集める。

 複数のリーチで共通するマスも
 重複させず1枚として扱う。
*/

function getReachTargets(){
 const {reach}=linesStatus();

 const result=new Set();

 for(const line of reach){
  for(const i of line){
   if(!state.cells[i].checked){
    result.add(i);
   }
  }
 }

 return shuffle([...result]);
}

/* 表示 */

function render(){
 const {bingo,reach}=linesStatus();

 const bset=new Set(bingo.flat());
 const rset=new Set(reach.flat());

 $('board').innerHTML='';

 state.cells.forEach((c,i)=>{
  const b=document.createElement('button');

  b.className='cell';

  const special=[
   'red',
   'aqua',
   'darkgreen',
   'orange',
   'darkblue'
  ].includes(c.kind);

  if(pickMode){

   if(!c.checked){
    b.classList.add('pick');
   }else{
    b.classList.add(
     c.kind==='free'
      ?'free'
      :c.kind==='normal'
       ?'checked'
       :c.kind
    );
   }

  }else if(special){

   b.classList.add(c.kind);

  }else if(c.kind==='love'){

   b.classList.add('love');

   if(bset.has(i)&&c.checked){
    b.classList.add('bingo');
   }else if(state.last===i&&c.checked){
    b.classList.add('last');
   }else if(c.checked){
    b.classList.add('checked');
   }

  }else if(bset.has(i)){

   b.classList.add('bingo');

  }else if(rset.has(i)&&!c.checked){

   b.classList.add('reach');

  }else if(state.last===i&&c.checked){

   b.classList.add('last');

  }else if(c.checked){

   b.classList.add('checked');
  }

  if(c.kind==='free'){
   b.classList.add('free');
  }

  if(
   negiSearchActive&&
   isStation(c.name)&&
   !c.checked
  ){
   b.classList.add('negi-found');
  }

  b.textContent=c.name;
  b.title=`${i+1}: ${c.name}`;

  b.onclick=()=>
   pickMode?choosePanel(i):toggle(i);

  $('board').appendChild(b);
 });

 $('board').classList.toggle(
  'pickmode',
  pickMode
 );

 $('stats').textContent=
  `開封 ${checkedCount()} / 99　｜　`+
  `あたり ${state.hits} 枚　｜　`+
  `リーチ ${reach.length}　｜　`+
  `ビンゴ ${bingo.length}`+
  (bingo.length===LINES.length
   ?' 🎉 ALL BINGO!'
   :'');

 $('lock').textContent=
  state.locked
   ?'🔒 ロック中'
   :'🔓 ロック';

 $('sound').textContent=
  state.sound
   ?'🔊 音あり'
   :'🔇 消音';

 $('new').disabled=
  state.locked||pickMode||modalBusy;

 $('negi').disabled=
  pickMode||modalBusy;

 $('negiSearch').disabled=
  pickMode||modalBusy;

 $('undo').disabled=
  pickMode||
  modalBusy||
  !state.negiHistory.length;

 $('undoStationEvent').disabled=
  state.locked||
  pickMode||
  modalBusy||
  !state.eventStation;

 $('reset').disabled=
  state.locked||
  pickMode||
  modalBusy;

 const names=[...new Set([
  ...AREAS,
  ...NORMAL,
  ...STAFF,
  ...STATIONS,
  'FREE',
  '愛❤️',
  ...state.cells.map(c=>c.name)
 ])].sort(comparePanels);

 const v=$('search').value;

 $('search').innerHTML=
  '<option value="">🔍 パネル検索</option>';

 for(const n of names){
  const o=document.createElement('option');

  o.value=n;
  o.textContent=n;

  $('search').appendChild(o);
 }

 $('search').value=
  names.includes(v)?v:'';

 if(v){
  highlight(v);
 }

 updateLineEffects(
  bingo.length,
  reach.length
 );
}

function updateLineEffects(bingoCount,reachCount){
 if(previousBingoCount!==null){

  if(bingoCount>previousBingoCount){

   playGameSound(bingoAudio);
   showBingoImage();

  }else if(
   previousReachCount!==null&&
   reachCount>previousReachCount
  ){

   playGameSound(reachAudio);
  }
 }

 previousBingoCount=bingoCount;
 previousReachCount=reachCount;
}

function highlight(v){
 [...$('board').children].forEach((el,i)=>{
  el.classList.toggle(
   'search-hit',
   !!v&&state.cells[i].name===v
  );
 });
}

/* 濃い青マス3回タップ解除 */

function handleBlueTap(i){
 if(modalBusy||pickMode)return;

 if(blueTapIndex===i){
  blueTapCount++;
 }else{
  blueTapIndex=i;
  blueTapCount=1;
 }

 if(blueTapCount<3){
  return;
 }

 blueTapIndex=-1;
 blueTapCount=0;

 if(!confirm(
  'この濃い青マスの自動開封を取り消しますか？'
 )){
  return;
 }

 const c=state.cells[i];

 if(
  c.kind!=='darkblue'||
  !c.checked
 ){
  return;
 }

 c.checked=false;
 c.kind='normal';
 c.hit=false;

 if(state.last===i){
  state.last=null;
 }

 save();
 render();
}

/* 通常マスの開閉 */

function toggle(i){
 if(modalBusy||pickMode)return;

 const c=state.cells[i];

 if(c.kind==='darkblue'){
  handleBlueTap(i);
  return;
 }

 blueTapIndex=-1;
 blueTapCount=0;

 if(['free','orange'].includes(c.kind)){
  return;
 }

 c.checked=!c.checked;

 if(c.checked){

  if(['red','aqua'].includes(c.kind)){
   c.originalTransformKind=c.kind;
   c.kind='darkgreen';
  }

  state.last=i;

  if(Math.random()<1/6){

   c.hit=true;
   state.hits++;

   showHitImage(state.hits);

   if(
    state.hits===7&&
    !state.hitEvents.sevenAudio
   ){
    state.hitEvents.sevenAudio=true;
    playGameSound(sevenAudio);
   }

   if(
    state.hits===10&&
    !state.hitEvents.tenAudio
   ){
    state.hitEvents.tenAudio=true;
    playGameSound(tenAudio);
   }

  }else{
   c.hit=false;
  }

 }else{

  if(c.kind==='darkgreen'){

   c.kind=
    c.originalTransformKind==='aqua'
     ?'aqua'
     :'red';

   delete c.originalTransformKind;
  }

  if(c.hit){
   state.hits=Math.max(
    0,
    state.hits-1
   );

   c.hit=false;
  }

  if(state.last===i){
   state.last=null;
  }
 }

 save();
 render();
 queueEvents();
}

/* イベント画面 */

function show(title,text,img,buttons){
 modalBusy=true;

 $('mtitle').textContent=title;
 $('mtext').textContent=text||'';

 const im=$('scene');

 if(img){
  im.src=encodeURI(img);
  im.classList.remove('hidden');
  im.onerror=()=>im.classList.add('hidden');
 }else{
  im.classList.add('hidden');
 }

 $('mactions').innerHTML='';

 for(const [label,fn] of buttons){
  const b=document.createElement('button');

  b.textContent=label;
  b.onclick=fn;

  $('mactions').appendChild(b);
 }

 $('modal').classList.add('show');
}

function close(){
 modalBusy=false;

 $('modal').classList.remove('show');

 save();
 render();

 setTimeout(queueEvents,50);
}

function message(title,text,img,after=close){
 show(
  title,
  text,
  img,
  [['OK',after]]
 );
}

function eligible(pred){
 return shuffle(
  state.cells
   .map((c,i)=>({c,i}))
   .filter(({c,i})=>
    i!==state.free&&
    !c.checked&&
    pred(c)
   )
   .map(({i})=>i)
 );
}

function transform(indices,names,kind){
 indices.forEach((i,j)=>{
  const c=state.cells[i];

  c.name=names[j%names.length];
  c.kind=kind;
  c.checked=false;
  c.hit=false;

  delete c.originalTransformKind;
 });
}

function allStationsOpen(){
 const a=state.cells.filter(c=>
  isStation(c.name)
 );

 return a.length>0&&
  a.every(c=>c.checked);
}

/* イベント判定 */

function queueEvents(){
 if(
  modalBusy||
  pickMode||
  state.pending
 ){
  return;
 }

 if(
  !state.event25&&
  manualCount()>=state.threshold
 ){
  state.event25=true;
  state.pending='question';

  save();
  question();
  return;
 }

 if(
  !state.eventStation&&
  allStationsOpen()
 ){
  state.eventStation=true;
  state.pending='station';

  save();
  stationEvent();
  return;
 }

 if(
  !state.event7&&
  state.hits>=7
 ){
  state.event7=true;
  state.pending='seven';

  save();
  sevenEvent();
  return;
 }

 /*
  新イベント：
  スタッフパネル制覇！
 */
 if(
  !state.eventStaffComplete&&
  staffCompleteConditions()
 ){
  state.eventStaffComplete=true;
  state.pending='staffComplete';

  save();
  staffCompleteEvent();
  return;
 }
}

/* 25～35マスイベント */

function question(){
 show(
  '最近ほかのステーションいった？',
  '正直に答えてね！',
  'Q.png',
  [
   ['YES',()=>{
    const ids=eligible(c=>
     !isStation(c.name)
    );

    const n=Math.min(
     ids.length,
     1+Math.floor(Math.random()*3)
    );

    transform(
     ids.slice(0,n),
     ['塩浜','新橋','麻布十番'],
     'red'
    );

    state.pending=null;

    message(
     'YES！',
     `${n}枚がステーションパネルに変わったよ！`,
     'YES.png'
    );
   }],

   ['NO',()=>{
    const lied=state.cells.some(c=>
     c.checked&&
     isStation(c.name)&&
     c.kind!=='orange'
    );

    if(lied){
     const f=state.cells[state.free];

     f.name='塩浜';
     f.checked=false;
     f.kind='red';

     state.pending=null;

     message(
      '嘘つき！',
      'FREEが塩浜に変わっちゃった！',
      'koto.png'
     );

     return;
    }

    const ids=eligible(c=>
     isStation(c.name)
    );

    const n=Math.min(
     ids.length,
     1+Math.floor(Math.random()*3)
    );

    transform(
     ids.slice(0,n),
     shuffle(STAFF_BASE).map(staffVariant),
     'aqua'
    );

    state.pending=null;

    message(
     'NO！',
     `${n}枚がスタッフパネルに変わったよ！`,
     'NO.png'
    );
   }]
  ]
 );
}

/* 全ステーションイベント */

function stationEvent(){
 show(
  '全部行ったんだのね',
  '増やすの？ 増やさないの？',
  'ara.png',
  [
   ['増やす',()=>{
    const ids=eligible(()=>true);

    const n=Math.min(
     ids.length,
     1+Math.floor(Math.random()*3)
    );

    transform(
     ids.slice(0,n),
     ['塩浜','新橋','大森'],
     'red'
    );

    state.stationEventUndo=null;
    state.pending=null;

    message(
     '浮気者！',
     `${n}枚がステーションに変化！`,
     'up.png'
    );
   }],

   ['増やさない',()=>{
    const ids=eligible(()=>true);

    if(ids.length){
     const i=ids[0];
     const c=state.cells[i];

     state.stationEventUndo={
      index:i,
      name:c.name,
      previousKind:c.kind,
      previousChecked:c.checked
     };

     c.checked=true;
     c.kind='darkblue';
    }

    state.pending=null;

    message(
     'ふ～ん',
     '未開封の1枚を開けてあげたよ。',
     'down.png'
    );
   }]
  ]
 );
}

/* イベント取消 */

function undoStationEvent(){
 if(
  modalBusy||
  pickMode||
  state.locked
 ){
  return;
 }

 if(!state.eventStation){
  alert('取り消すイベントがありません。');
  return;
 }

 const history=state.stationEventUndo;

 if(
  !history||
  !Number.isInteger(history.index)||
  !state.cells[history.index]||
  state.cells[history.index].kind!=='darkblue'||
  !state.cells[history.index].checked
 ){
  alert(
   'このイベントの自動開封履歴を特定できません。\n'+
   '濃い青マスを3回タップすると、\n'+
   'そのマスだけを取り消せます。\n'+
   'カードは変更していません。'
  );

  return;
 }

 const c=state.cells[history.index];

 if(!confirm(
  `${c.name} のイベント開封を取り消しますか？\n\n`+
  'イベントの発生済み状態も解除します。'
 )){
  return;
 }

 c.checked=history.previousChecked;
 c.kind=history.previousKind||'normal';
 c.hit=false;

 state.eventStation=false;
 state.stationEventUndo=null;
 state.pending=null;

 if(state.last===history.index){
  state.last=null;
 }

 save();
 render();

 alert('イベントを取り消しました。');
}

/* あたり7枚イベント */

function sevenEvent(){
 show(
  'あたり7枚達成！',
  '今から二つから一つ選んでね',
  'or.png',
  [
   ['A：ステーション3枚',()=>{
    const ids=eligible(()=>true);
    const {reach}=linesStatus();

    const priority=new Set(
     reach.flat().filter(i=>
      !state.cells[i].checked
     )
    );

    ids.sort((a,b)=>
     Number(priority.has(b))-
     Number(priority.has(a))
    );

    const selected=ids.slice(0,3);

    transform(
     selected,
     Array.from(
      {length:3},
      ()=>random(STATIONS)
     ),
     'red'
    );

    state.pending=null;

    message(
     'Aを選択！',
     `${selected.length}枚がARK3以外のステーションに変化！`,
     'YES.png'
    );
   }],

   ['B：笹塚への愛',()=>sevenB()]
  ]
 );
}

function sevenB(){
 show(
  '困難な選択だよ？',
  '笹塚に3回もお届けだよ？ いいの？',
  'answer.png',
  [
   ['いいえ',()=>{
    state.pending=null;

    message(
     'じゃあそのままにしとくね',
     '今回は変化なし。',
     'bay.png'
    );
   }],

   ['はい',()=>{
    const ids=eligible(()=>true).slice(0,1);

    transform(
     ids,
     ['笹塚'],
     'red'
    );

    state.pending='choose';
    save();

    message(
     'そう、ちゃんと受け取ったよ！',
     '笹塚への愛を！',
     'thank you.png',
     ()=>startPick()
    );
   }]
  ]
 );
}

function startPick(){
 show(
  '選んで！好きな場所を',
  '未開封の白いマスを1枚選んでね。',
  'present.png',
  [
   ['選択画面へ',()=>{
    modalBusy=false;

    $('modal').classList.remove('show');

    pickMode=true;
    render();
   }]
  ]
 );
}

function choosePanel(i){
 const c=state.cells[i];

 if(!pickMode)return;

 if(c.checked){
  toast('そこは違うよ！ 白いマスを選んでね');
  return;
 }

 c.checked=true;
 c.kind='darkblue';

 pickMode=false;
 state.pending=null;

 save();
 render();

 message(
  'プレゼント！',
  `${c.name} を開封したよ！`,
  null
 );
}

/*
 =====================================
 新イベント：スタッフパネル制覇！
 =====================================

 表向きは50/50

 実際は：
 スタッフ 50%
 ステーション 20%
 愛❤️ 30%

 まず50%でスタッフ当たり。
 残り50%のうち、
 60%を愛❤️へ変換する。

 0.5 × 0.6 = 0.3

 最終的に
 スタッフ 50%
 ステーション 20%
 愛❤️ 30%
*/

function staffCompleteEvent(){
 show(
  '🎉 スタッフパネル制覇！',
  '50/50 挑戦しますか？\n\n'+
  '当たりが出れば、リーチマス1つがスタッフマスに変わります！\n\n'+
  'ハズレならステーションマスに！',
  null,
  [
   ['挑戦する！',()=>{
    staffCompleteChallenge();
   }],

   ['挑戦しない',()=>{
    state.pending=null;

    message(
     '今回は見送り！',
     'スタッフパネル制覇、おめでとう！',
     null
    );
   }]
  ]
 );
}

function staffCompleteChallenge(){

 const targets=getReachTargets();

 if(targets.length===0){

  state.pending=null;

  message(
   '対象マスがありません',
   'リーチを完成させる未開封マスが見つからなかったよ。',
   null
  );

  return;
 }

 // リーチの最後の1マスをランダムに選択
 const i=random(targets);
 const c=state.cells[i];

 const roll=Math.random();

 let result;

 if(roll<0.5){

  result='staff';

 }else{

  // ステーション側50%のうち
  // 60%を愛❤️へ変更
  const loveRoll=Math.random();

  result=
   loveRoll<0.6
    ?'love'
    :'station';
 }

 /*
  マスの開封状態は変更しない。
  名前と種類のみ変更する。
 */

 if(result==='staff'){

  c.name=randomStaff();
  c.kind='aqua';

 }else if(result==='station'){

  c.name=random(STATIONS);
  c.kind='red';

 }else{

  c.name='愛❤️';
  c.kind='love';
 }

 c.checked=false;
 c.hit=false;

 delete c.originalTransformKind;

 state.pending=null;

 save();

 if(result==='staff'){

  message(
   '🎉 当たり！！',
   'リーチマスがスタッフパネルに変わったよ！\n\n'+
   `新しいパネル：${c.name}`,
   null
  );

 }else if(result==='station'){

  message(
   '残念！ ハズレ！',
   'リーチマスがステーションパネルに変わったよ！\n\n'+
   `新しいパネル：${c.name}`,
   null
  );

 }else{

  message(
   '❤️ 愛があふれた！',
   'なんと、特別な「愛❤️」パネルが出現！\n\n'+
   'このマスは通常どおり開封できるよ。',
   null
  );
 }
}

/* ネギ配達 */

function negiDelivery(){
 if(modalBusy||pickMode)return;

 const ids=eligible(c=>
  isStation(c.name)
 );

 if(!ids.length){
  toast('未開封のステーションがないよ');
  return;
 }

 const i=ids[0];
 const c=state.cells[i];

 state.negiHistory.push({
  i,
  kind:c.kind
 });

 c.checked=true;
 c.kind='orange';
 state.last=i;

 save();
 render();
 queueEvents();
}

function negiUndo(){
 if(
  modalBusy||
  pickMode||
  !state.negiHistory.length
 ){
  return;
 }

 const x=state.negiHistory.pop();
 const c=state.cells[x.i];

 if(c.kind==='orange'){
  c.checked=false;
  c.kind=x.kind||'normal';

  if(state.last===x.i){
   state.last=null;
  }
 }

 save();
 render();
}

/* 操作ボタン */

$('negiSearch').onclick=()=>{
 if(modalBusy||pickMode)return;

 negiSearchActive=!negiSearchActive;

 render();
};

$('search').onchange=e=>{
 highlight(e.target.value);
};

$('negi').onclick=negiDelivery;

$('undo').onclick=negiUndo;

$('undoStationEvent').onclick=undoStationEvent;

$('lock').onclick=()=>{
 if(modalBusy||pickMode)return;

 state.locked=!state.locked;

 save();
 render();
};

$('sound').onclick=()=>{
 state.sound=!state.sound;

 save();
 render();
};

$('new').onclick=()=>{
 if(
  state.locked||
  pickMode||
  modalBusy
 ){
  return;
 }

 state=fresh();

 previousBingoCount=null;
 previousReachCount=null;

 blueTapIndex=-1;
 blueTapCount=0;

 save();
 render();
};

$('reset').onclick=()=>{
 if(
  state.locked||
  pickMode||
  modalBusy
 ){
  return;
 }

 if(!confirm(
  '全データを消去します。\n'+
  '元には戻せません。\n'+
  'よろしいですか？'
 )){
  return;
 }

 if(!confirm(
  '本当に全データを消しますか？'
 )){
  return;
 }

 localStorage.removeItem(KEY);

 state=fresh();

 previousBingoCount=null;
 previousReachCount=null;

 blueTapIndex=-1;
 blueTapCount=0;

 save();
 render();
};

/* 起動 */

state=load();

if(repairMissingStations()){
 save();
}

render();

if(state.pending){

 setTimeout(()=>{

  if(state.pending==='question'){

   question();

  }else if(state.pending==='station'){

   stationEvent();

  }else if(state.pending==='seven'){

   sevenEvent();

  }else if(state.pending==='choose'){

   startPick();

  }else if(state.pending==='staffComplete'){

   staffCompleteEvent();
  }

 },300);

}else{

 queueEvents();
}
